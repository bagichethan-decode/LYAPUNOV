services:
  postgres:
    image: postgres:16-alpine
    container_name: lyapunov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lyapunov
      POSTGRES_USER: lyapunov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyapunov -d lyapunov"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:3.7.0
    container_name: lyapunov-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  metrics-volume-init:
    image: alpine:3.21
    container_name: lyapunov-metrics-volume-init
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - "chown -R 10001:10001 /textfile && chmod 775 /textfile"
    volumes:
      - prometheus-textfile:/textfile
    restart: "no"

  metrics-updater:
    image: lyapunov:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lyapunov-metrics-updater
    restart: unless-stopped
    user: "10001:10001"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          java -cp '/app/app.jar:/app/dependency/*' com.lyapunov.cli.WorkerMetricsCli 30 /textfile/lyapunov-workers.prom || echo "Metrics update failed";
          chmod 644 /textfile/lyapunov-workers.prom 2>/dev/null || true;
          sleep 15;
        done
    environment:
      LYAPUNOV_JDBC_URL: jdbc:postgresql://postgres:5432/lyapunov
      LYAPUNOV_DB_USER: lyapunov
      LYAPUNOV_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - prometheus-textfile:/textfile
    depends_on:
      postgres:
        condition: service_healthy
      metrics-volume-init:
        condition: service_completed_successfully

  api:
    image: lyapunov:local
    container_name: lyapunov-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      JAVA_MAIN_CLASS: com.lyapunov.cli.HealthApiCli
      LYAPUNOV_API_HOST: 0.0.0.0
      LYAPUNOV_API_PORT: 8080
      LYAPUNOV_JDBC_URL: jdbc:postgresql://postgres:5432/lyapunov
      LYAPUNOV_DB_USER: lyapunov
      LYAPUNOV_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      LYAPUNOV_KAFKA_HOST: kafka
      LYAPUNOV_KAFKA_PORT: 29092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - java
        - -cp
        - /app/app.jar:/app/dependency/*
        - com.lyapunov.cli.ApiHealthcheckCli
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: lyapunov-node-exporter
    restart: unless-stopped
    command:
      - "--collector.textfile.directory=/textfile"
    volumes:
      - prometheus-textfile:/textfile:ro
    ports:
      - "127.0.0.1:9100:9100"
    depends_on:
      - metrics-updater

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: lyapunov-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/lyapunov-alerts.yml:/etc/prometheus/lyapunov-alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:11.6.0
    container_name: lyapunov-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  kafkadata:
  prometheus-textfile:
  prometheus-data:
  grafana-data:
